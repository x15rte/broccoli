name: CodeQL

# Advanced code scanning setup: the two analyses default setup ran, checked in
# here so their action versions are pinned and their matrix is explicit. The
# release workflow publishes only commits that are ancestors of main, so the
# analyses that ran on a main push cover the released tree.
on:
  push:
    branches: [main]
    # A push carrying only material no analysis reads skips the run. This list
    # is the exception, not the rule — a path nobody named here still triggers —
    # and unlike the three gate workflows it keeps two paths as triggers:
    # .github/workflows/ (the actions analysis reads every workflow file) and
    # vendor/ (it holds a vendored Rust crate), so neither is listed.
    paths-ignore:
      - ".gitignore"
      - ".github/dependabot.yml"
      - ".github/release-notes/**"
      - "LICENSE"
      - "README.md"
      - "SECURITY.md"
      - "assets/**"
      - "broccoli.rc"
      - "deny.toml"
      - "proto/**"
      - "supply-chain/**"
  pull_request:
  schedule:
    # Weekly, the cadence default setup used: the queries and the database move
    # without a commit here, so a run has to happen on a timer even when the
    # tree is quiet.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# One group per ref, so cancellation only ever touches superseded runs of the
# same ref: a pull-request run can never cancel main, while a second push to
# main still supersedes the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # The same check names default setup produced, so nothing that reads them
    # changes with this file. No commit subject can skip the analysis.
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      # The actions analysis lists the repository's own workflows and their
      # referenced actions, which is why it needs read access to Actions.
      actions: read
      # Uploading the analysis results is the only write this workflow needs.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Default setup analyzed these two languages in two separate runs, one
        # check each; a matrix keeps that shape and lets one language fail
        # without cancelling the other.
        language: [actions, rust]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No build: both languages are analyzed from source, which is what
      # default setup did and why this workflow needs no Rust toolchain.
      # The two CodeQL steps share one action version: init writes the run's
      # configuration file and analyze refuses one from a different version.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      # One category per language: without it the two matrix legs would upload
      # into the same analysis slot and overwrite each other's results.
      # Version must match the init pin above.
      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
