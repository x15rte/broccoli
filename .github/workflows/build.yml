name: build

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Read-only at the workflow level. The only write in this workflow is the
# publish job below, which asks for `contents: write` itself, so the job that
# compiles and smoke-tests the tree never holds a write token.
permissions:
  contents: read

concurrency:
  # Tag pushes and manual builds serialize per ref name; runs for different
  # refs run concurrently. Manual runs never publish (the publish job is
  # tag-push-only), so two publish-capable runs can never overlap.
  group: broccoli-build-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the Windows release
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh

    # The publish job needs these three values; they cross jobs through job
    # outputs (written to $GITHUB_OUTPUT by the validation step) instead of
    # the environment, so nothing in this job's environment is assumed by the
    # job that holds the write token.
    outputs:
      release_tag: ${{ steps.validate.outputs.release_tag }}
      version: ${{ steps.validate.outputs.version }}
      zip_name: ${{ steps.validate.outputs.zip_name }}

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref }}

      # Release gating model: the gates (test, deny, vet, CodeQL) run on every
      # push to main, so every commit that is an ancestor of main has passed
      # them. A tag is publishable only when the commit it names is such an
      # ancestor — then the gates that ran on main cover exactly this tree —
      # and the validation step below additionally pins the tag to the Cargo
      # version and to the commit being built. A tag on a commit that reached
      # main through no gated push cannot pass here. Manual dispatch builds
      # the portable zip but never publishes.
      - name: Require the tagged commit to be an ancestor of main
        if: github.event_name == 'push'
        run: |
          $ErrorActionPreference = 'Stop'
          # The repository is public and checkout persists no credentials, so
          # main is fetched anonymously rather than with the write token that
          # this job deliberately does not have.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw "git fetch origin main failed with exit code $LASTEXITCODE" }
          git merge-base --is-ancestor HEAD origin/main
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 1) {
              throw "release commit $env:GITHUB_SHA is not an ancestor of main; only a main-gated commit can be released"
          }
          if ($exitCode -ne 0) { throw "git merge-base --is-ancestor failed with exit code $exitCode" }

      # Publishing is tag-push-only: on tag pushes the release tag must be
      # stable SemVer, exactly equal the Cargo package version, and point at
      # the commit being built (which the step above proved is on main).
      # Manual dispatch builds the portable zip but never publishes, so those
      # assertions (and BROCCOLI_RELEASE_TAG) apply to tag pushes only. The
      # Cargo version and the release contract are validated on every run.
      - name: Validate Cargo version and artifact contract
        id: validate
        run: |
          $ErrorActionPreference = 'Stop'

          $metadataJson = & cargo metadata --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) { throw "cargo metadata failed with exit code $LASTEXITCODE" }
          $metadata = ($metadataJson -join [Environment]::NewLine) | ConvertFrom-Json
          $packages = @($metadata.packages | Where-Object { $_.name -eq 'broccoli' })
          if ($packages.Count -ne 1) {
              throw "expected exactly one broccoli package, found $($packages.Count)"
          }
          $package = $packages[0]
          $version = [string]$package.version
          $release = $package.metadata.broccoli.release
          if ($null -eq $release) { throw 'Cargo release metadata is missing' }
          $target = [string]$release.target
          if ($target -cne 'x86_64-pc-windows-msvc') {
              throw "release target must be x86_64-pc-windows-msvc (got $target)"
          }

          if ($env:GITHUB_EVENT_NAME -eq 'push') {
              $tag = $env:GITHUB_REF_NAME
              if ($tag -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
                  throw "release tag must be stable SemVer prefixed with v (got '$tag')"
              }
              if ($tag -cne "v$version") {
                  throw "release tag $tag does not match Cargo package version $version"
              }
              $tagCommit = (& git rev-parse "$tag^{commit}").Trim()
              if ($LASTEXITCODE -ne 0) { throw "release tag $tag is not present in the checkout" }
              $headCommit = (& git rev-parse 'HEAD').Trim()
              if ($LASTEXITCODE -ne 0) { throw 'could not resolve the checked-out commit' }
              if ($tagCommit -cne $headCommit) {
                  throw "checked-out commit $headCommit is not release tag $tag ($tagCommit)"
              }
              "release_tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

          $zipName = "broccoli-v$version-win64.zip"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "zip_name=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "BROCCOLI_TARGET=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BROCCOLI_ZIP_PATH=dist/$zipName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # protobuf-src 2.1.1+27.1 cannot compile on Windows/MSVC (upstream
      # LNK2038 runtime-library mismatch), so CI pins a verified protoc 27.1
      # (build.rs KNOWN_GOOD_PROTOC_VERSION) and exports it as PROTOC for
      # every subsequent build instead of using the vendored-protoc feature.
      - name: Download and verify pinned protoc 27.1
        run: |
          $ErrorActionPreference = 'Stop'
          $protocVersion = '27.1'
          $expectedSha256 = 'da531c51ccd1290d8d34821f0ce4e219c7fbaa6f9825f5a3fb092a9d03fe6206'
          $zipUrl = "https://github.com/protocolbuffers/protobuf/releases/download/v$protocVersion/protoc-$protocVersion-win64.zip"
          $zipPath = Join-Path $env:RUNNER_TEMP 'protoc-27.1-win64.zip'
          $extractDir = Join-Path $env:RUNNER_TEMP 'protoc-27.1'
          Invoke-WebRequest -UseBasicParsing -Uri $zipUrl -OutFile $zipPath
          $actualSha256 = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -cne $expectedSha256) {
              throw "protoc $protocVersion win64 SHA2-256 mismatch: pinned $expectedSha256, got $actualSha256"
          }
          Expand-Archive -LiteralPath $zipPath -DestinationPath $extractDir -Force
          $protocPath = Join-Path $extractDir 'bin\protoc.exe'
          if (-not (Test-Path -LiteralPath $protocPath -PathType Leaf)) {
              throw "extracted protoc is missing: $protocPath"
          }
          "PROTOC=$protocPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # No test suite in this workflow: the gates (test, deny, vet, CodeQL)
      # already ran on this tree when it was pushed to main, which is what the
      # ancestry check above establishes. The smoke test below still validates
      # the release binary itself, which is the build-specific check that
      # matters.
      - name: Build the release executable
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release --locked --target $env:BROCCOLI_TARGET
          if ($LASTEXITCODE -ne 0) { throw "cargo build --release failed with exit code $LASTEXITCODE" }

      # The published binary is the one being smoke-tested: the release build
      # (LTO thin, codegen-units 1) is executed with --core-helper and must
      # exit 2 with the guard message. No separate debug build is needed.
      - name: Smoke-test the release executable
        run: |
          $ErrorActionPreference = 'Stop'
          $broccoli = Join-Path $PWD "target\$env:BROCCOLI_TARGET\release\broccoli.exe"
          if (-not (Test-Path -LiteralPath $broccoli -PathType Leaf)) {
              throw "smoke-test executable is missing: $broccoli"
          }
          $stderrPath = Join-Path $env:RUNNER_TEMP 'broccoli-smoke-stderr.txt'
          Remove-Item -LiteralPath $stderrPath -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $broccoli `
              -ArgumentList '--core-helper' `
              -RedirectStandardError $stderrPath `
              -NoNewWindow -Wait -PassThru
          $stderr = if (Test-Path -LiteralPath $stderrPath) {
              [IO.File]::ReadAllText($stderrPath)
          } else {
              ''
          }
          if ($process.ExitCode -ne 2 -or
              $stderr -notmatch 'missing or invalid authenticated launch parameters') {
              throw "broccoli helper-guard smoke test failed (exit $($process.ExitCode)): $stderr"
          }

      - name: Assemble the portable zip
        env:
          BROCCOLI_ZIP_NAME: ${{ steps.validate.outputs.zip_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path 'dist' -Force | Out-Null

          $stageDir = Join-Path $env:RUNNER_TEMP 'broccoli-release-stage'
          Remove-Item -LiteralPath $stageDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null

          $broccoli = "target\$env:BROCCOLI_TARGET\release\broccoli.exe"
          if (-not (Test-Path -LiteralPath $broccoli -PathType Leaf)) {
              throw "release executable is missing: $broccoli"
          }
          Copy-Item -LiteralPath $broccoli -Destination $stageDir

          # The zip must ship the license text (MIT): fail loudly when the
          # repo root has no LICENSE* file instead of silently publishing an
          # exe-only archive.
          $licenseFiles = @(Get-ChildItem -LiteralPath $PWD -File -Filter 'LICENSE*')
          if ($licenseFiles.Count -eq 0) {
              throw "release zip must include the LICENSE file(s); none found in the repository root"
          }
          foreach ($license in $licenseFiles) {
              Copy-Item -LiteralPath $license.FullName -Destination $stageDir
          }

          $zipPath = "dist\$env:BROCCOLI_ZIP_NAME"
          Compress-Archive -Path (Join-Path $stageDir '*') -DestinationPath $zipPath -CompressionLevel Optimal
          if (-not (Test-Path -LiteralPath $zipPath -PathType Leaf)) {
              throw "expected release artifact is missing: $zipPath"
          }
          $actualNames = @(Get-ChildItem -LiteralPath 'dist' -File |
              ForEach-Object { $_.Name })
          if ($actualNames.Count -ne 1 -or $actualNames[0] -cne $env:BROCCOLI_ZIP_NAME) {
              throw "dist must contain exactly $env:BROCCOLI_ZIP_NAME; found $($actualNames -join ', ')"
          }

      - name: Upload the release zip as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: broccoli-windows-${{ steps.validate.outputs.version }}
          path: ${{ env.BROCCOLI_ZIP_PATH }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  # Publication is a separate job because it is the only step that needs a
  # write token: this job alone holds `contents: write`, and the build job
  # that compiled the tree never does. Manual dispatch builds but never
  # publishes; only tag pushes create the GitHub Release. Re-publishing
  # requires deleting the existing release and the tag, then re-pushing the
  # tag — which re-triggers this workflow on the same commit.
  publish:
    name: Publish the GitHub release
    needs: build
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh

    steps:
      # Full history, because the release notes below come from the commit
      # log since the previous tag, and the tag itself must be present.
      - name: Check out the tagged commit with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Download the release zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: broccoli-windows-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BROCCOLI_RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          BROCCOLI_VERSION: ${{ needs.build.outputs.version }}
          BROCCOLI_ZIP_NAME: ${{ needs.build.outputs.zip_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:BROCCOLI_RELEASE_TAG
          $zipPath = Join-Path 'dist' $env:BROCCOLI_ZIP_NAME
          if (-not (Test-Path -LiteralPath $zipPath -PathType Leaf)) {
              throw "downloaded release zip is missing: $zipPath"
          }

          # Release notes come from the commit history. GitHub's own generator
          # only lists merged pull requests, which on this repository means the
          # Dependabot bumps — none of the actual changes, since they land as
          # commits. A note file for the tag overrides the generated list.
          $override = ".github/release-notes/$tag.md"
          if (Test-Path -LiteralPath $override -PathType Leaf) {
              $notesArguments = @('--notes-file', $override)
          } else {
              # `git describe` fails on the first release, which is the case
              # with no previous tag to compare against.
              $previous = (git describe --tags --abbrev=0 --match 'v*.*.*' "$tag^" 2>$null)
              if ([string]::IsNullOrWhiteSpace($previous)) {
                  $range = $tag
                  $compare = "https://github.com/$env:GITHUB_REPOSITORY/commits/$tag"
              } else {
                  $previous = $previous.Trim()
                  $range = "$previous..$tag"
                  $compare = "https://github.com/$env:GITHUB_REPOSITORY/compare/$previous...$tag"
              }
              # Dependency bumps are not changes a user reads about; they arrive
              # as squash merges titled "Bump …".
              $bullets = git log --no-merges --invert-grep --grep='^Bump ' `
                  --pretty=format:'- %s (%h)' $range
              $notes = @(
                  "## What's Changed",
                  '',
                  ($bullets -join "`n"),
                  '',
                  "**Full Changelog**: $compare"
              ) -join "`n"
              $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
              Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
              $notesArguments = @('--notes-file', $notesPath)
          }

          $arguments = @(
              'release', 'create', $tag,
              '--repo', $env:GITHUB_REPOSITORY,
              '--verify-tag',
              '--title', "Broccoli $env:BROCCOLI_VERSION"
          ) + $notesArguments + @(
              '--latest',
              $zipPath
          )
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publication failed with exit code $LASTEXITCODE" }
