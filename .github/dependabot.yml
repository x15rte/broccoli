version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A new release is not proposed until it has been public for a week, so a
    # compromised or immediately-yanked release is skipped instead of adopted.
    # Security updates ignore the cooldown by design: an advisory fix lands as
    # soon as it exists.
    cooldown:
      default-days: 7
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Same quarantine window for crates; combined with the cargo-vet store
    # this makes a version bump a matter of waiting, not of per-crate review.
    cooldown:
      default-days: 7
    # glib reaches the lockfile only through tray-icon's Linux gtk backend and
    # is absent from the Windows dependency graph the project ships. The
    # advisory on glib 0.18.5 is fixed in 0.20.0, which only moves together
    # with the whole gtk-rs 0.18 stack — so every security-update run ended in
    # "security update not possible" for a crate that no user build compiles.
    # `ignore` also applies to security updates, which is intended here.
    # Revisit when libappindicator or muda publishes against gtk-rs 0.19+
    # (both still pin gtk ^0.18 at their latest release): the bump then becomes
    # a normal version update and this entry can go.
    ignore:
      - dependency-name: glib
