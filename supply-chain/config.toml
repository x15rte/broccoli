
# cargo-vet config file

[cargo-vet]
version = "0.10"

[imports.google]
url = "https://raw.githubusercontent.com/google/supply-chain/main/audits.toml"

[imports.mozilla]
url = "https://raw.githubusercontent.com/mozilla/supply-chain/main/audits.toml"

[policy.eframe]
audit-as-crates-io = false

[policy.egui-winit]
audit-as-crates-io = false

[policy.wgpu-hal]
audit-as-crates-io = false

[[exemptions.nix]]
version = "0.31.3"
criteria = "safe-to-deploy"
notes = "Unix-only dependency of zip 9; absent from the Windows-target graph this project ships and checks in deny.toml."

[[exemptions.quinn-udp]]
version = "0.5.15"
criteria = "safe-to-deploy"

[[exemptions.rand_pcg]]
version = "0.10.2"
criteria = "safe-to-deploy"

[[exemptions.rcgen]]
version = "0.13.2"
criteria = "safe-to-run"

[[exemptions.rusticata-macros]]
version = "4.1.0"
criteria = "safe-to-deploy"

[[exemptions.tinyvec]]
version = "1.12.0"
criteria = "safe-to-deploy"

[[exemptions.x509-parser]]
version = "0.16.0"
criteria = "safe-to-deploy"

[[exemptions.yasna]]
version = "0.5.2"
criteria = "safe-to-run"
