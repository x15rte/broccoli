
# cargo-vet config file

[cargo-vet]
version = "0.10"

[imports.google]
url = "https://raw.githubusercontent.com/google/supply-chain/main/audits.toml"

[imports.mozilla]
url = "https://raw.githubusercontent.com/mozilla/supply-chain/main/audits.toml"

[policy.eframe]
audit-as-crates-io = false

[policy.egui-winit]
audit-as-crates-io = false

[policy.wgpu-hal]
audit-as-crates-io = false

[[exemptions.accesskit_ios]]
version = "0.2.2"
criteria = "safe-to-deploy"
notes = "iOS-only accesskit backend, pulled in by egui 0.37; absent from the Windows-target graph this project ships and checks in deny.toml."

[[exemptions.accesskit_windows]]
version = "0.35.2"
criteria = "safe-to-deploy"
notes = "Windows accessibility bridge reached through accesskit_winit in egui 0.37. The 0.32.1 -> 0.35.2 delta is not reviewed yet, so this records the deferred review."

[[exemptions.accesskit_winit]]
version = "0.34.2"
criteria = "safe-to-deploy"
notes = "Winit accessibility bridge in egui 0.37. The 0.32.2 -> 0.34.2 delta is not reviewed yet, so this records the deferred review."

[[exemptions.egui_system_font_provider]]
version = "0.37.0"
criteria = "safe-to-deploy"
notes = "New egui 0.37 crate that loads system fonts through fontique; not reviewed yet, so this records the deferred review."

[[exemptions.fontique]]
version = "0.11.1"
criteria = "safe-to-deploy"
notes = "System font enumeration behind egui_system_font_provider; not reviewed yet, so this records the deferred review."

[[exemptions.md-5]]
version = "0.11.0"
criteria = "safe-to-deploy"
notes = "RustCrypto MD5 with default features off (no oid), used only to derive xray's deterministic wintun adapter GUID; the digest algorithm is not a security primitive here."

[[exemptions.nix]]
version = "0.31.3"
criteria = "safe-to-deploy"
notes = "Unix-only dependency of zip 9; absent from the Windows-target graph this project ships and checks in deny.toml."

[[exemptions.nom]]
version = "8.0.0"
criteria = "safe-to-deploy"
notes = "Parser reached through the 0.37 font stack. The 7.1.3 -> 8.0.0 major is not reviewed yet, so this records the deferred review."

[[exemptions.objc2-core-text]]
version = "0.3.2"
criteria = "safe-to-deploy"
notes = "macOS-only text bindings used by fontique; absent from the Windows-target graph this project ships and checks in deny.toml."

[[exemptions.os_pipe]]
version = "1.2.3"
